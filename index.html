gg<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 2 Projects</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #1f2937, #111827);
        color: #f9fafb;
      }

      .card {
        width: min(92vw, 760px);
        padding: 2rem;
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.9);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 2.6rem);
      }

      p {
        line-height: 1.7;
        color: #d1d5db;
      }

      .links {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .links a {
        display: block;
        padding: 1rem 1.2rem;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(90deg, #4f46e5, #2563eb);
        transition: transform 0.2s ease;
      }

      .links a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Level 2 Project Showcase</h1>
      <p>Choose a completed experience to explore.</p>
      <div class="links">
        <a href="calculator.html">Open the Calculator</a>
        <a href="tribute.html">Open the Tribute Page</a>
      </div>
    </main>
  </body>
</html>
